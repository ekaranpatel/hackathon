<svg width="900" height="900" viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7C1"/>
      <stop offset="50%" stop-color="#D9AF52"/>
      <stop offset="100%" stop-color="#A87E2E"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#F7E7C1" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#F7E7C1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ambient glow lifting the mark off a dark background -->
  <circle cx="450" cy="450" r="310" fill="url(#glow)"/>

  <!-- outer hexagonal seal: the vault's boundary -->
  <polygon points="450,120 702,270 702,570 450,720 198,570 198,270"
           fill="none" stroke="url(#metal)" stroke-width="9" stroke-linejoin="round"/>

  <!-- vault door ring -->
  <circle cx="450" cy="440" r="175" fill="none" stroke="url(#metal)" stroke-width="9"/>

  <!-- monogram: a V built from a book's open pages -->
  <g fill="none" stroke="url(#metal)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 380 372 L 450 500 L 520 372"/>
  </g>

  <!-- graduation cap resting above the V, clean and separate -->
  <g fill="url(#metal)" stroke="none">
    <polygon points="450,318 512,346 450,374 388,346"/>
    <rect x="444" y="374" width="12" height="26" rx="3"/>
  </g>
  <g fill="none" stroke="url(#metal)" stroke-width="5" stroke-linecap="round">
    <path d="M 505 349 L 505 372 C 505 384 450 384 450 372"/>
  </g>

  <!-- keyhole: the vault's lock, anchoring the base of the V -->
  <g fill="url(#metal)" stroke="none">
    <circle cx="450" cy="522" r="10"/>
    <polygon points="443,522 457,522 463,552 437,552"/>
  </g>
</svg>
